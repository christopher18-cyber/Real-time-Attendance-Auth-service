server.port=2000
spring.datasource.url=jdbc:h2:mem:smartattend;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
jwt.secret=local-development-key-change-before-deployment-123456789
GMAIL_CLIENT_ID=local
GMAIL_CLIENT_SECRET=local
GMAIL_REFRESH_TOKEN=local
GMAIL_SENDER=local@smartattend.test
